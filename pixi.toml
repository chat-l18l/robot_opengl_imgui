[workspace]
name = "robot-opengl-imgui"
description = "A 6-DOF robot arm you can pose from sliders, in one C++ window"
channels = ["https://prefix.dev/conda-forge"]
# Linux only: the viewer links libGL directly instead of using a GL loader,
# and it asks for GL 3.3 core, which rules out the Raspberry Pi's V3D driver.
platforms = ["linux-64"]

[dependencies]
cmake = ">=3.14"
ninja = "*"
cxx-compiler = ">=2.0.0,<3"
pkg-config = "*"
glfw = ">=3.4,<4"
eigen = ">=3.4,<6"
zlib = ">=1.3,<2"
# GL headers and the libglvnd dispatcher; the driver itself stays the
# system's, found at run time.
libgl-devel = ">=1.7,<2"
# Only for tools/make-test-models.py, which uses the standard library alone.
python = "3.12.*"

[tasks]
# Configure once. After that `cmake --build` reconfigures by itself when a
# CMakeLists.txt changes, so there is nothing to gain from running it again.
configure = { cmd = "cmake -S . -B build -G Ninja -DCMAKE_PREFIX_PATH=$CONDA_PREFIX", outputs = ["build/CMakeCache.txt"] }
build = { cmd = "cmake --build build", depends-on = ["configure"] }
test = { cmd = "ctest --test-dir build --output-on-failure", depends-on = ["build"] }
viewer = { cmd = "./build/robot_viewer", depends-on = ["build"] }
shots = { cmd = "sh tools/make-screenshots.sh", depends-on = ["build"] }
test-models = "python tools/make-test-models.py"
fetch-samples = "sh tools/fetch-sample-models.sh"

# Asserts on, optimiser off, in its own tree so it never disturbs the release build.
build-debug = "cmake -S . -B build-debug -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_PREFIX_PATH=$CONDA_PREFIX && cmake --build build-debug"
